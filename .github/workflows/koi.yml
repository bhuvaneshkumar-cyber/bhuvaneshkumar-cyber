name: Generate koi

on:
  schedule:
    - cron: "20 0 * * *"   # just after midnight UTC, so the koi shows the day that just ended
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: white   # white, black, asagi, tea, gold or platinum
          output-dir: koi
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
